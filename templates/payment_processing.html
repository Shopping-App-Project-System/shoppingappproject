<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>正在前往綠界刷卡頁｜MineMarket</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{
            --gold:#F0C93A; --diamond:#5DECF5; --diamond-dk:#1ABAC8;
            --grass:#5D9E3F; --leaf:#2A6320;
            --sky-top:#7DC6FF; --sky-bot:#B8E0FF;
            --stone:#7F7F7F; --stone-dk:#545454;
            --white:#F0F0F0; --black:#1A1A1A;
            --pixel:"Press Start 2P",monospace;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:var(--pixel);
            background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-bot) 100%);
            min-height:100vh;display:flex;align-items:center;justify-content:center;
            image-rendering:pixelated;
        }
        .processing-box{
            text-align:center;
            background:repeating-linear-gradient(180deg,#6b6b6b 0,#6b6b6b 6px,#545454 6px,#545454 12px);
            border:4px solid #000;
            box-shadow:inset -4px -4px 0 rgba(0,0,0,.5),inset 4px 4px 0 rgba(255,255,255,.25),8px 8px 0 #000;
            padding:48px 64px;max-width:520px;
        }
        h1{
            font-size:1rem;color:var(--gold);
            text-shadow:3px 3px 0 #000;
            margin-bottom:24px;line-height:1.6;
        }
        .order-info{
            font-size:.6rem;color:var(--white);text-shadow:2px 2px 0 #000;
            line-height:2;margin-bottom:32px;
        }
        .total{font-size:.85rem;color:var(--diamond);text-shadow:3px 3px 0 #000;}

        /* loading 像素方塊動畫 */
        .pixel-loader{
            display:inline-flex;gap:6px;margin:24px 0;
        }
        .pixel-loader span{
            width:18px;height:18px;
            background:var(--diamond);
            border:3px solid #000;
            box-shadow:inset -2px -2px 0 var(--diamond-dk);
            animation:bounce 1s steps(4) infinite;
        }
        .pixel-loader span:nth-child(2){animation-delay:.15s;}
        .pixel-loader span:nth-child(3){animation-delay:.3s;}
        .pixel-loader span:nth-child(4){animation-delay:.45s;}
        @keyframes bounce{
            0%,100%{transform:translateY(0);}
            50%{transform:translateY(-12px);}
        }

        .status-text{
            font-size:.65rem;color:var(--white);text-shadow:2px 2px 0 #000;
            margin-top:16px;line-height:1.8;
        }
        .small-note{
            font-size:.5rem;color:#aaa;text-shadow:1px 1px 0 #000;
            margin-top:24px;line-height:2;font-family:"Noto Sans TC",sans-serif;
        }

        /* 像素 Steve 頭 */
        .steve-head{
            width:48px;height:48px;margin:0 auto 16px;
            background:
                linear-gradient(#3aaa3a 0,#3aaa3a 100%) 0 0/48px 48px no-repeat,
                linear-gradient(#000 0,#000 100%) 7px 9px/11px 11px no-repeat,
                linear-gradient(#000 0,#000 100%) 30px 9px/11px 11px no-repeat,
                linear-gradient(#fff 0,#fff 100%) 9px 11px/4px 4px no-repeat,
                linear-gradient(#fff 0,#fff 100%) 32px 11px/4px 4px no-repeat,
                linear-gradient(#000 0,#000 100%) 14px 26px/20px 5px no-repeat,
                #8B5E3C;
            border:3px solid #000;
            box-shadow:4px 4px 0 #000;
        }
    </style>
</head>
<body>
    <div class="processing-box">
        <div class="steve-head"></div>
        <h1>🛡 安全傳送中</h1>
        <div class="order-info">
            訂單編號 #{{ order_id }}<br>
            <span class="total">NT$ {{ total }}</span>
        </div>

        <div class="pixel-loader">
            <span></span><span></span><span></span><span></span>
        </div>

        <div class="status-text" id="status-text">正在連線綠界 ECPay…</div>

        <!-- 自動 POST 到綠界的隱藏 form -->
        <form id="ecpay-form" method="POST" action="{{ ecpay_url }}" style="display:none;">
            {% for k, v in ecpay_params.items() %}
            <input type="hidden" name="{{ k }}" value="{{ v }}">
            {% endfor %}
        </form>

        <div class="small-note">
            ⚠ 請勿關閉此頁面或重新整理瀏覽器<br>
            若 5 秒後沒有自動跳轉，請手動點擊
            <a href="#" onclick="document.getElementById('ecpay-form').submit();return false;"
               style="color:var(--diamond);">這裡前往綠界</a>
        </div>
    </div>

    <script>
        // 顯示進度文字
        const statusMessages = [
            '正在連線綠界 ECPay…',
            '驗證訂單資訊…',
            '加密交易資料…',
            '前往刷卡頁面…'
        ];
        let idx = 0;
        const statusEl = document.getElementById('status-text');
        const interval = setInterval(() => {
            idx = (idx + 1) % statusMessages.length;
            statusEl.textContent = statusMessages[idx];
        }, 600);

        // 1.5 秒後自動 submit 到綠界
        setTimeout(() => {
            clearInterval(interval);
            statusEl.textContent = '跳轉中…';
            document.getElementById('ecpay-form').submit();
        }, 1500);
    </script>
</body>
</html>

<div class="card-bottom">
    <span class="price">
        {% if product.sale_price and product.sale_price < product.original_price %} 
            <strong class="sale-price">NT$ {{ product.sale_price }}</strong>
            <del class="original-price-muted">NT$ {{ product.original_price }}</del>
        {% else %}
            <span class="normal-price">NT$ {{ product.original_price }}</span>
        {% endif %}
    </span>

    <div class="action-group" style="display: flex; gap: 8px; align-items: center;">
        
        <form action="/cart/add" method="post" style="display:inline">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <input type="hidden" name="next" value="/">
            <button type="submit" class="btn">加入</button>
        </form>

        {% if session.get('is_admin') %}
        <form action="/manage/remove" method="post" style="display:inline" onsubmit="return confirm('確定要將此商品下架嗎？')">
            <input type="hidden" name="product_id" value="{{ product.id }}">
            <input type="hidden" name="next" value="/">
            <button type="submit" class="btn btn-admin-remove">下架</button>
        </form>
        {% endif %}

    </div>
</div>
